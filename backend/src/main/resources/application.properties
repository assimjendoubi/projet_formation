spring.application.name=training-platform

# ============================================================
# MySQL / XAMPP Configuration
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/training_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=dGhpcy1pcy1hLXZlcnktc2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci10cmFpbmluZy1wbGF0Zm9ybS0yMDI0
app.jwt.expiration=86400000

# ============================================================
# Springdoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

# ============================================================
# Logging
# ============================================================
logging.level.com.example=DEBUG
logging.level.org.springframework.security=WARN
